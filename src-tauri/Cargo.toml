[package]
name = "sudhir-codex-tauri"
version = "0.1.0"
description = "Lightweight personal desktop frontend for sudhir-codex"
edition = "2021"

[lib]
name = "sudhir_codex_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time"] }
rfd = "0.17.2"
