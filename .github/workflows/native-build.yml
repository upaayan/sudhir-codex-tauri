name: native-build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platforms to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - macos
          - windows

env:
  NODE_VERSION: "24.16.0"
  PNPM_VERSION: "11.5.2"

jobs:
  macos:
    if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript unit and fake app-server integration tests
        run: node --test tests/codex-rpc.test.ts tests/codex-state.test.ts
      - name: Typecheck
        run: pnpm typecheck
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Apple Silicon bundle
        run: pnpm tauri build --target aarch64-apple-darwin
      - name: Ad-hoc sign and verify
        working-directory: src-tauri/target/aarch64-apple-darwin/release/bundle/macos
        run: |
          codesign --force --deep --sign - "Sudhir-Codex Tauri.app"
          codesign --verify --deep --strict "Sudhir-Codex Tauri.app"
      - name: ZIP the app
        working-directory: src-tauri/target/aarch64-apple-darwin/release/bundle/macos
        run: ditto -c -k --sequesterRsrc --keepParent "Sudhir-Codex Tauri.app" "Sudhir-Codex-Tauri-macos-aarch64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: sudhir-codex-tauri-macos-aarch64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Sudhir-Codex-Tauri-macos-aarch64.zip

  windows:
    if: ${{ github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript unit and fake app-server integration tests
        run: node --test tests/codex-rpc.test.ts tests/codex-state.test.ts
      - name: Typecheck
        run: pnpm typecheck
      - name: Rust tests (including WSL launch-spec tests)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build x64 NSIS bundle
        run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: sudhir-codex-tauri-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
